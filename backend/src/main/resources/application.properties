
# アプリケーション名
spring.application.name=flexible-attendance-app

# H2 Database 設定 (開発用の簡易DB)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2コンソールをブラウザで確認できるようにする
spring.h2.console.enabled=true

# Spring Security のデフォルトログインを一時的に無効化（動作確認を優先するため）
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# ローカル環境以外（Codespacesのプロキシ経由など）からのブラウザアクセスを明示的に許可する設定
spring.h2.console.settings.web-allow-others=true

# フロントエンド（Vite）のローカルサーバーのURLを指定
cors.allowed-origins=http://localhost:5173,https://ubiquitous-spork-4vq65g5rr79c5j6q-8080.app.github.dev
